name: gait_analysis_app
description: MediaPipe動的歩行分析アプリ

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # HTTP & Networking
  http: ^1.1.0
  dio: ^5.3.2
  
  # Video & Camera
  camera: ^0.10.5+5
  video_player: ^2.7.2
  image_picker: ^1.0.4
  
  # File handling
  file_picker: ^6.1.1
  path_provider: ^2.1.1
  
  # Charts & Visualization
  fl_chart: ^0.64.0
  syncfusion_flutter_charts: ^23.1.44
  
  # PDF Generation
  pdf: ^3.10.6
  printing: ^5.11.1
  
  # Storage & Database
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.1.0
  logger: ^2.0.2+1
  
  # UI Components
  flutter_svg: ^2.0.8
  lottie: ^2.7.0
  shimmer: ^3.0.0
  
  # Permissions
  permission_handler: ^11.1.0
  
  # Web specific
  universal_html: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Linting
  flutter_lints: ^3.0.0
  
  # Testing
  mockito: ^5.4.2
  bloc_test: ^9.1.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf
        - asset: assets/fonts/NotoSansJP-Bold.ttf
          weight: 700
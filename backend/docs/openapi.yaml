info:
  contact:
    email: support@gaitanalysis.com
    name: Gait Analysis API Support
  description: "\n    ## Enhanced MediaPipe歩行分析API v2.0\n\n    スマートフォンで撮影した動画から歩行パターンを分析し、\n\
    \    理学療法士や医療従事者向けの詳細なレポートを生成する拡張APIです。\n\n    ### \U0001F680 新機能（v2.0 Enhanced）\n\
    \    - **30秒高速処理**: 撮影からレポート出力まで30秒以内\n    - **33ランドマーク活用**: MediaPipe Pose v0.10の全機能\n\
    \    - **代償動作検出**: 自動アラート機能付き\n    - **重心・バランス分析**: COM軌跡とバランス安定性評価\n    - **拡張出力**:\
    \ 正規化波形グラフ、スローモーション動画、カラーPDFレポート\n    - **iPad/iPhone最適化**: 60fps対応、横・後方撮影モード\n\
    \n    ### \U0001F4CA 詳細分析機能\n    - **スパイオテンポラル指標**: ピッチ、歩幅/ストライド長、立脚/遊脚時間、対称性指標\n\
    \    - **キネマティクス**: 股関節ROM、膝関節詳細角度、足関節背屈/底屈、骨盤・体幹回旋\n    - **代償動作アラート**: アウト/イントゥーイング、膝外反/内反、トレンデレンブルグ、ペルビックドロップ\n\
    \    - **バランス指標**: COM水平/垂直移動幅、重心投影線2Dマップ\n\n    ### \U0001F3AF 対象ユーザー\n    -\
    \ **理学療法士**: 詳細な歩行評価と治療計画立案\n    - **作業療法士**: 日常生活動作の評価\n    - **医師**: 診断支援と経過観察\n\
    \    - **研究者**: 歩行データの定量的解析\n    - **アスリート・トレーナー**: パフォーマンス向上\n\n    ### ⚙️ 技術仕様（Enhanced）\n\
    \    - **バックエンド**: FastAPI + Python 3.11+\n    - **AI処理**: MediaPipe Pose v0.10\
    \ + 最高精度モデル\n    - **並列処理**: マルチコア活用による高速化\n    - **データベース**: PostgreSQL + Redis\
    \ キャッシュ\n    - **認証**: Firebase Auth + JWT\n    - **監視**: リアルタイムパフォーマンス監視\n  \
    \  - **出力**: PDF/MP4/JSON/CSV 多形式対応\n    "
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
  title: Enhanced MediaPipe Gait Analysis API
  version: 2.0.0-enhanced
openapi: 3.1.0
paths:
  /:
    get:
      description: ルートエンドポイント
      operationId: root__get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Root
  /api/v1/auth/firebase:
    post:
      description: "Firebase認証ログイン\n\nArgs:\n    firebase_token: FirebaseIDトークン\n\
        \    request: HTTPリクエスト\n    db: データベースセッション\n    \nReturns:\n    TokenResponse:\
        \ 認証トークンとユーザー情報"
      operationId: firebase_login_api_v1_auth_firebase_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HTTPAuthorizationCredentials'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Firebase Login
      tags:
      - auth
      - 認証
  /api/v1/auth/login:
    post:
      description: "ユーザーログイン\n\nArgs:\n    user_data: ログインデータ\n    request: HTTPリクエスト\n\
        \    db: データベースセッション\n    \nReturns:\n    TokenResponse: 認証トークンとユーザー情報"
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:

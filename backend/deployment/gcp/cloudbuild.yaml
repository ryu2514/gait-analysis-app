# Google Cloud Build configuration
steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/gait-analysis-api:$BUILD_ID', '.']
    dir: '.'

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/gait-analysis-api:$BUILD_ID']

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
    - 'run'
    - 'deploy'
    - 'gait-analysis-api'
    - '--image'
    - 'gcr.io/$PROJECT_ID/gait-analysis-api:$BUILD_ID'
    - '--region'
    - 'us-central1'
    - '--platform'
    - 'managed'
    - '--allow-unauthenticated'
    - '--port'
    - '8000'
    - '--memory'
    - '2Gi'
    - '--cpu'
    - '2'
    - '--max-instances'
    - '10'
    - '--min-instances'
    - '1'
    - '--timeout'
    - '600'
    - '--set-env-vars'
    - 'DEBUG=False,LOG_LEVEL=INFO'
    - '--set-cloudsql-instances'
    - '$PROJECT_ID:us-central1:gait-analysis-db'

  # Test the deployment
  - name: 'gcr.io/cloud-builders/curl'
    args: ['--fail', '--silent', '--show-error', 'https://gait-analysis-api-$PROJECT_ID.a.run.app/api/v1/health']

# Substitute variables
substitutions:
  _SERVICE_NAME: gait-analysis-api
  _REGION: us-central1

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  
# Build timeout
timeout: '1200s'

# Images to be pushed to Container Registry
images:
  - 'gcr.io/$PROJECT_ID/gait-analysis-api:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/gait-analysis-api:latest'